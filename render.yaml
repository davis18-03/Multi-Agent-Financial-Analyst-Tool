# Render.com deployment configuration for Multi-Agent Financial Analyst Tool
# This file configures the FastAPI backend service on Render

services:
  # FastAPI Backend Service
  - type: web
    name: multi-agent-fin-analyst-backend
    env: python
    region: oregon
    plan: free  # Change to 'starter' or higher for production
    pythonVersion: "3.10"
    
    # Build configuration
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r backend/requirements.txt
      
    # Start command
    startCommand: |
      cd backend && uvicorn api:app --host 0.0.0.0 --port $PORT
    
    # Environment variables
    envVars:
      # Application Configuration
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      
      # LLM Configuration
      - key: LLM_PROVIDER
        value: openrouter  # or 'openai', 'huggingface', 'fallback'
      - key: LLM_MODEL_NAME
        value: openai/gpt-3.5-turbo  # OpenRouter model format
      - key: LLM_MAX_TOKENS
        value: 200
      - key: LLM_TEMPERATURE
        value: 0.3
      
      # API Keys (set these in Render dashboard)
      - key: OPENROUTER_API_KEY
        sync: false  # This must be set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Alternative: set this if using OpenAI directly
      
      # Data Configuration
      - key: CACHE_SIZE
        value: 128
      - key: REQUEST_TIMEOUT
        value: 30
      
      # Vector Store Configuration
      - key: VECTOR_STORE_PATH
        value: /opt/render/project/src/vector_store
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      
      # Chart Configuration
      - key: CHART_SAVE_PATH
        value: /opt/render/project/src/charts
      
      # CORS Configuration
      - key: CORS_ORIGINS
        value: "https://your-streamlit-app.onrender.com"  # Update with your Streamlit Cloud URL
    
    # Health check
    healthCheckPath: /health
    
    # Auto-deploy from main branch
    autoDeploy: true
    branch: main
    
    # Disk and memory configuration
    disk:
      name: vector-store-disk
      mountPath: /opt/render/project/src/vector_store
      sizeGB: 1

  # Optional: Database service for persistent storage
  # Uncomment if you need a database
  # - type: pserv
  #   name: multi-agent-fin-analyst-db
  #   env: postgresql
  #   plan: free
  #   region: oregon
  #   disk:
  #     name: postgres-disk
  #     sizeGB: 1

